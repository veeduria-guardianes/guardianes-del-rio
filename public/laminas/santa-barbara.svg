<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Lámina: caso Santa Bárbara">
  <rect width="1080" height="1080" fill="#F8F3EA"/>
  <rect x="0" y="0" width="1080" height="230" fill="#366F77"/>
  <text x="80" y="105" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold" fill="#FFFDF8">Guardianes del Río</text>
  <text x="80" y="155" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFDF8" opacity="0.85">Veeduría ciudadana · Popayán, Cauca</text>
  <text x="80" y="195" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFDF8" opacity="0.7">El agua no se negocia, se defiende.</text>

  <text x="540" y="330" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="6" fill="#4A5A50" text-anchor="middle">EL CASO DE SANTA BÁRBARA</text>
  <text x="540" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" fill="#225130" text-anchor="middle">El agua del Pisojé está en juego</text>

  <g>
    <rect x="150" y="470" width="360" height="230" rx="24" fill="#FFFDF8" stroke="#E6DCCB"/>
    <text x="330" y="585" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold" fill="#DF5E1D" text-anchor="middle">6</text>
    <text x="330" y="645" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#4A5A50" text-anchor="middle">títulos mineros vigentes</text>
  </g>
  <g>
    <rect x="570" y="470" width="360" height="230" rx="24" fill="#FFFDF8" stroke="#E6DCCB"/>
    <text x="750" y="585" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold" fill="#DF5E1D" text-anchor="middle">+7</text>
    <text x="750" y="645" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#4A5A50" text-anchor="middle">solicitudes en trámite</text>
  </g>

  <text x="540" y="790" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#225130" text-anchor="middle">En este corregimiento y la subcuenca del río Pisojé,</text>
  <text x="540" y="830" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#225130" text-anchor="middle">fuente alterna del acueducto de Popayán en época seca.</text>

  <text x="540" y="950" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4A5A50" text-anchor="middle">Fuente: mediciones oficiales del municipio · Acta 001 de 2025</text>

  <rect x="0" y="1010" width="1080" height="70" fill="#225130"/>
  <text x="540" y="1053" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFDF8" text-anchor="middle">Conoce el mapa: guardianesdelrio.org</text>
</svg>
